<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cancún Survey</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial; padding: 18px; }
    #results { display: none; white-space: pre-wrap; border: 1px solid #ddd; padding: 8px; margin-top: 12px; background: #fafafa; }
    fieldset { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Cancún Survey</h1>
  <form id="survey-form">
    <fieldset>
      <label>
        Name:
        <input name="name" type="text" />
      </label>
      <br />
      <label>
        Favorite beach:
        <input name="beach" type="text" />
      </label>
    </fieldset>

    <!-- Ensure this is type="button" so it doesn't submit the form -->
    <button type="button" id="view-results">View results</button>
    <!-- Use a submit button for final submit -->
    <button type="submit" id="submit-survey">Submit survey</button>
  </form>

  <div id="results" aria-live="polite"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('survey-form');
      const viewBtn = document.getElementById('view-results');
      const resultsEl = document.getElementById('results');

      function formDataToObject(fd) {
        const obj = {};
        for (const [k, v] of fd.entries()) {
          if (Object.prototype.hasOwnProperty.call(obj, k)) {
            if (!Array.isArray(obj[k])) obj[k] = [obj[k]];
            obj[k].push(v);
          } else {
            obj[k] = v;
          }
        }
        return obj;
      }

      // View results button should never submit the form or reset it
      viewBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const data = new FormData(form);
        resultsEl.textContent = JSON.stringify(formDataToObject(data), null, 2);
        resultsEl.style.display = 'block';
      });

      // Intercept form submission to avoid page reload. If you want to allow normal POST,
      // remove the call to e.preventDefault(). We intentionally do NOT call form.reset().
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const data = new FormData(form);
        const body = JSON.stringify(formDataToObject(data));

        // Example: send to server (uncomment and set URL if needed)
        /*
        fetch('/submit-survey', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body,
        })
        .then(r => r.json())
        .then(resp => {
          // handle response
        })
        .catch(err => console.error(err));
        */

        resultsEl.textContent = 'Submitted (local preview):\n' + body;
        resultsEl.style.display = 'block';
      });

      // Defensive: prevent accidental form resets from keyboard shortcuts or other handlers
      form.addEventListener('reset', (e) => {
        // Prevent automatic resets unless explicitly intended
        e.preventDefault();
        // If you do want to allow resets, remove this listener.
      });
    });
  </script>
</body>
</html>

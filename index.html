<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏝️ Cancun Resort Survey - June 2025</title>

<style>
/* ====== BASE + UI (UNCHANGED) ====== */
* { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin:0; padding:20px; min-height:100vh; }
.container { max-width:800px; margin:auto; }

.nav-tabs { display:flex; gap:10px; margin-bottom:20px; }
.nav-tab { padding:12px 24px; background:rgba(255,255,255,.2); color:white; border:none; border-radius:30px; cursor:pointer; font-weight:600; }
.nav-tab.active, .nav-tab:hover { background:white; color:#667eea; }

.page { display:none; }
.page.active { display:block; }

.results-container { display:none; background:white; border-radius:16px; padding:30px; }
.results-container.show { display:block; }

/* 🔒 LOCK SURVEY AFTER SUBMIT */
.results-mode #surveyForm { display:none !important; }
</style>
</head>

<body>
<div class="container">

<div class="nav-tabs">
  <button class="nav-tab active" onclick="showPage('survey')">📝 Take Survey</button>
  <button class="nav-tab" onclick="showPage('admin')">📊 View Results</button>
</div>

<div id="surveyPage" class="page active">

<form id="surveyForm">
  <h2>🏝️ Cancun Resort Survey</h2>
  <p>Name *</p>
  <input name="name" required>

  <p>Final Vote *</p>
  <label><input type="radio" name="final_vote" value="epm" required> Excellence Playa Mujeres</label><br>
  <label><input type="radio" name="final_vote" value="erc"> Excellence Riviera Cancun</label><br>
  <label><input type="radio" name="final_vote" value="smb"> Secrets Maroma Beach</label><br>
  <label><input type="radio" name="final_vote" value="me"> Majestic Elegance</label><br><br>

  <button type="submit">Submit & See Results</button>
</form>

<div id="resultsContainer" class="results-container">
  <h3>✅ Your Results</h3>
  <p id="finalChoiceDisplay"></p>

  <button onclick="showPage('admin')">📊 View Group Results</button>
  <button onclick="resetSurvey()">🔄 Take Survey Again</button>
</div>

</div>

<div id="adminPage" class="page">
  <h2>📊 Group Results</h2>
  <p><strong><span id="responseCount">0</span></strong> responses</p>
  <ul id="resultsList"></ul>
</div>

</div>

<script>
/* ================= CONFIG ================= */
const BIN_URL = "https://api.jsonbin.io/v3/b/69821ad843b1c97be9627691";
const API_KEY = "$2a$10$ny/JlyejRBBpQLyZLIPE2.BDdEwO3B3ah0ilg9ZvLEl5SvSLuC7MW";

/* ================= STATE ================= */
let allResponses = [];
let showingResults = false;

/* ================= NAV ================= */
function showPage(page) {
  if (showingResults && page === 'survey') return;

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));

  document.getElementById(page + 'Page').classList.add('active');
  document.querySelector(`[onclick="showPage('${page}')"]`).classList.add('active');

  if (page === 'admin') loadResponses().then(updateAdminDashboard);
}

/* ================= JSONBIN ================= */
async function loadResponses() {
  const res = await fetch(BIN_URL + "/latest", {
    headers: { "X-Master-Key": API_KEY }
  });
  const data = await res.json();
  allResponses = data?.record?.responses || [];
}

async function saveResponse(resp) {
  await loadResponses();
  allResponses.push(resp);

  await fetch(BIN_URL, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": API_KEY
    },
    body: JSON.stringify({ responses: allResponses })
  });
}

/* ================= SUBMIT ================= */
document.getElementById('surveyForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const fd = new FormData(this);
  const response = {
    id: crypto.randomUUID(),
    name: fd.get('name'),
    finalChoice: fd.get('final_vote'),
    timestamp: new Date().toISOString()
  };

  await saveResponse(response);

  document.getElementById('finalChoiceDisplay').textContent =
    "Your pick: " + response.finalChoice.toUpperCase();

  document.getElementById('resultsContainer').classList.add('show');
  document.getElementById('surveyPage').classList.add('results-mode');

  showingResults = true;
});

/* ================= RESET ================= */
function resetSurvey() {
  showingResults = false;
  document.getElementById('surveyForm').reset();
  document.getElementById('resultsContainer').classList.remove('show');
  document.getElementById('surveyPage').classList.remove('results-mode');
  showPage('survey');
}

/* ================= ADMIN ================= */
function updateAdminDashboard() {
  document.getElementById('responseCount').textContent = allResponses.length;
  document.getElementById('resultsList').innerHTML =
    allResponses.map(r => `<li>${r.name}: ${r.finalChoice}</li>`).join('');
}
</script>
</body>
</html>
